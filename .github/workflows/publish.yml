name: Stage verified desktop installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: "1.0.1"
        type: string
      platform:
        description: Verified installer to stage
        required: true
        type: choice
        options: [mac, windows]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the verified build artifact
        env:
          MAC_URL: ${{ secrets.MAC_ARTIFACT_URL }}
          WINDOWS_URL: ${{ secrets.WINDOWS_ARTIFACT_URL }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = mac ]; then url="$MAC_URL"; extension=dmg; else url="$WINDOWS_URL"; extension=exe; fi
          test -n "$url"
          curl --fail --silent --show-error --location --retry 2 --max-time 300 "$url" --output artifact.zip
          mkdir installers
          unzip -j artifact.zip "*.$extension" -d installers
          cd installers
          sha256sum * > "SHA256SUMS-$PLATFORM.txt"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          else
            gh release create "v$VERSION" --draft --title "Spitzer Data $VERSION" --notes 'Mac runtime signing correction. This build remains ad-hoc signed and is not Apple-notarized. Installation help: https://spitzerdata.com/desktop.'
          fi
          gh release upload "v$VERSION" installers/* --clobber
